name: open_dex_texture
description: Native raw-frame texture bridges for DroidPier.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: OpenDexTexturePlugin
      windows:
        pluginClass: OpenDexTexturePluginCApi
      macos:
        pluginClass: OpenDexTexturePlugin
