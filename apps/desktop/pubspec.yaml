name: open_android_dex
description: DroidPier desktop workspace for Android.
publish_to: none
version: 0.1.0-beta.2+2

environment:
  sdk: ^3.13.1

dependencies:
  qr_flutter: 4.1.0
  flutter:
    sdk: flutter
  open_dex_api:
    path: ../../packages/open_dex_api
  open_dex_core:
    path: ../../packages/open_dex_core
  open_dex_platform:
    path: ../../plugins/open_dex_platform
  open_dex_protocol:
    path: ../../packages/open_dex_protocol
  open_dex_texture:
    path: ../../plugins/open_dex_texture

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real application on a real Linux window, which the widget suite
  # cannot: plugins, the texture host and the video path only exist in a running
  # app. 47 test files and a strong golden suite cover the pieces; nothing ran
  # the product until this.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
