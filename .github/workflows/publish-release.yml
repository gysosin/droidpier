name: Publish verified beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Require completed acceptance for this version
        run: python3 tool/verify_release.py
      - name: Verify draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 tool/version.py)"
          test "$(gh release view "v$version" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "v$version" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          gh release download "v$version" --dir dist
          python3 tool/check_artifacts.py
          gh release edit "v$version" --draft=false --prerelease
