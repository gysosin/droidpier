name: Experimental native bridges
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/open_dex_texture/**'
      - 'apps/desktop/windows/**'
      - 'apps/desktop/macos/**'
      - '.github/workflows/native-builds.yml'
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
          - runner: macos-14
            platform: macos
          - runner: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Resolve packages
        run: flutter pub get
        working-directory: apps/desktop
      - name: Compile experimental bridge
        run: flutter build ${{ matrix.platform }} --release --no-tree-shake-icons
        working-directory: apps/desktop
