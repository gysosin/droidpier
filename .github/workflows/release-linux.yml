name: Linux and Android draft
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-linux-android
  cancel-in-progress: false
jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Validate source
        run: python3 tool/verify_source.py
      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Build the one signed Android payload
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DROIDPIER_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export DROIDPIER_KEYSTORE="$RUNNER_TEMP/droidpier-release.p12"
          trap 'rm -f "$DROIDPIER_KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$DROIDPIER_KEYSTORE"
          python3 tool/build_android.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-android-payload
          path: |
            dist/*.apk
            dist/open-dex-agent.jar
          if-no-files-found: error
  linux:
    needs: android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-android-payload
          path: dist
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev build-essential dpkg-dev rpm file libfuse2 libglu1-mesa
      - name: Build and package
        env:
          DROIDPIER_ANDROID_PAYLOAD_DIR: ${{ github.workspace }}/dist
          FLUTTER_BIN: flutter
        run: |
          bash tool/build_linux.sh
          python3 tool/prepare_sources.py
          python3 tool/check_artifacts.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-android-candidate
          path: dist/
          if-no-files-found: error
  draft:
    needs: linux
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-android-candidate
          path: dist
      - name: Create immutable candidate draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 tool/version.py)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'A release for this version already exists; inspect it or choose a new version.' >&2
            exit 1
          fi
          gh release create "v$version" dist/droidpier-* dist/SHA256SUMS --draft --prerelease --target "$GITHUB_SHA"             --title "DroidPier $version" --notes-file "docs/releases/$version.md"
